<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Wireframe Booking Futsal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: di HP satu kolom (navigasi, bingkai layar, catatan); di layar lebar bingkai di kiri, catatan di kanan */
:root {
  --bg: #eef2ef;
  --screen: #ffffff;
  --fg: #18211c;
  --muted: #5a6860;
  --line: #c5cfc8;
  --fill: #e4eae6;
  --accent: #2e7a4d;
  --accent-fg: #ffffff;
  --accent-soft: #dcede2;
  --warn: #9c4d18;
  --warn-soft: #f8e8dc;
  --danger: #b3261e;
  --danger-soft: #f7e1df;
  --scrim: rgba(16, 24, 20, 0.45);
  --f-display: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --screen: #19201c; --fg: #e4ebe6; --muted: #98a69e; --line: #35413a; --fill: #252f2a;
    --accent: #62c08a; --accent-fg: #0c1811; --accent-soft: #1e3227; --warn: #e5a170; --warn-soft: #39291d;
    --danger: #f08a80; --danger-soft: #3a1f1d; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --screen: #19201c; --fg: #e4ebe6; --muted: #98a69e; --line: #35413a; --fill: #252f2a;
  --accent: #62c08a; --accent-fg: #0c1811; --accent-soft: #1e3227; --warn: #e5a170; --warn-soft: #39291d;
  --danger: #f08a80; --danger-soft: #3a1f1d; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
button, input, select { font: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 20px; }
.top { display: grid; gap: 4px; }
.eyebrow { font: 500 12px/1.4 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.top h1 { font: 600 clamp(1.55rem, 4.5vw, 2.1rem)/1.15 var(--f-display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.meta { color: var(--muted); margin: 0; font-size: 14px; }

.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.stage { display: grid; gap: 12px; min-width: 0; }
@media (min-width: 820px) {
  .layout { grid-template-columns: 400px minmax(0, 1fr); align-items: start; }
  .notes { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
}

.stepnav { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px; align-items: center; max-width: 400px; width: 100%; margin-inline: auto; }
.nav-btn { height: 44px; border: 1.5px solid var(--line); background: var(--screen); color: var(--fg); border-radius: 12px; display: grid; place-items: center; cursor: pointer; }
.nav-btn:disabled { opacity: .4; cursor: default; }
#pick { width: 100%; height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--screen); color: var(--fg); font-weight: 600; font-size: 14px; padding: 0 12px; }

/* Bingkai layar HP */
.device {
  position: relative; width: 100%; max-width: 400px; min-height: 690px; margin-inline: auto;
  background: var(--screen); border: 1.5px solid var(--line); border-radius: 28px; overflow: hidden;
  display: flex; flex-direction: column;
}
.statusbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 22px 4px; font: 600 12px var(--f-mono); color: var(--muted); }
.sb { display: flex; gap: 3px; align-items: flex-end; }
.sb i { width: 3px; background: var(--muted); border-radius: 1px; }
.sb i:nth-child(1) { height: 5px; } .sb i:nth-child(2) { height: 8px; } .sb i:nth-child(3) { height: 11px; }
.sb b { width: 20px; height: 10px; border: 1.5px solid var(--muted); border-radius: 3px; margin-left: 5px; }
.appbar { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; padding: 4px 10px 10px; border-bottom: 1px solid var(--line); }
.appbar h2 { font: 600 16px/1.3 var(--f-display); text-align: center; margin: 0; }
.icon-btn { width: 40px; height: 40px; border: none; background: none; color: var(--fg); border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: var(--fill); }
.body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.center { text-align: center; align-items: center; }
.foot { margin-top: auto; padding: 12px 16px 18px; border-top: 1px solid var(--line); display: grid; gap: 8px; background: var(--screen); }
.btn { appearance: none; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 15px; padding: 13px 16px; border-radius: 12px; cursor: pointer; width: 100%; }
.btn:disabled { background: var(--fill); border-color: var(--fill); color: var(--muted); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.label { font: 500 11px/1.4 var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

/* Placeholder gambar ala wireframe (kotak bersilang) */
.ph {
  position: relative; display: grid; place-items: center; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 12px;
  background:
    linear-gradient(to top right, transparent calc(50% - .75px), var(--line) 50%, transparent calc(50% + .75px)),
    linear-gradient(to top left, transparent calc(50% - .75px), var(--line) 50%, transparent calc(50% + .75px)),
    var(--fill);
}
.ph em { font: 500 10px var(--f-mono); font-style: normal; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--fill); padding: 2px 6px; border-radius: 4px; }

/* Beranda */
.hello { margin: 0; color: var(--muted); }
.big { font: 600 24px/1.2 var(--f-display); margin: 0; }
.hero-card { display: grid; gap: 6px; text-align: left; border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--fg); border-radius: 16px; padding: 14px; cursor: pointer; }
.hero-card .ph { aspect-ratio: 21 / 9; }
.hero-card strong { font: 600 19px/1.2 var(--f-display); }
.hero-card span { font-size: 14px; color: var(--muted); }
.group { display: grid; gap: 8px; }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 14px; margin: 0; }
.mini { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; }
.mini b { display: block; }
.mini span { font-size: 13px; color: var(--muted); }
.pill { font: 600 12px var(--f-mono); background: var(--accent-soft); color: var(--accent) !important; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.inforow { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.inforow span:first-child { color: var(--muted); }
.tabbar { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); padding: 10px 0 16px; text-align: center; font: 500 12px var(--f-mono); color: var(--muted); }
.tabbar .on { color: var(--accent); font-weight: 600; }

/* Pilih lapangan */
.lap { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 10px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--screen); color: var(--fg); cursor: pointer; width: 100%; }
.lap:hover { border-color: var(--accent); }
.lap .ph { aspect-ratio: 1; border-radius: 10px; }
.lap b { font: 600 16px/1.3 var(--f-display); display: block; }
.lap span { display: block; font-size: 13px; color: var(--muted); }
.lap .price { color: var(--fg); font-weight: 600; margin-top: 4px; }

/* Pilih jadwal */
.ctx { display: flex; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; align-items: baseline; }
.ctx b { font: 600 16px var(--f-display); }
.ctx span { font-size: 13px; color: var(--muted); }
.month { font-weight: 600; font-size: 14px; margin: 0 0 -6px; text-transform: capitalize; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding: 0 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-width: 60px; display: grid; gap: 1px; justify-items: center; padding: 8px 6px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--screen); color: var(--fg); cursor: pointer; }
.chip span { font-size: 11px; color: var(--muted); }
.chip b { font: 600 18px var(--f-display); font-variant-numeric: tabular-nums; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip.on span { color: var(--accent-fg); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.lg { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line); display: inline-block; background: var(--screen); }
.lg.sel { background: var(--accent); border-color: var(--accent); }
.lg.taken, .slot.taken { background: repeating-linear-gradient(135deg, var(--fill) 0 5px, var(--screen) 5px 10px); }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { display: grid; gap: 1px; justify-items: center; padding: 9px 4px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--screen); color: var(--fg); cursor: pointer; }
.slot b { font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.slot span { font-size: 11px; color: var(--muted); }
.slot.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.slot.sel span { color: var(--accent-fg); }
.slot.taken { color: var(--muted); cursor: not-allowed; }
.slot.taken b { text-decoration: line-through; font-weight: 500; }
.slot.past { opacity: .45; cursor: not-allowed; }
.sum { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
.sum b { font: 600 18px var(--f-display); font-variant-numeric: tabular-nums; }
.sum.muted { color: var(--muted); }

/* Ringkasan */
.box { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.rows { display: grid; gap: 6px; margin: 0; }
.rows div { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.rows dt { color: var(--muted); }
.rows dd { margin: 0; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.rows .total { border-top: 1px dashed var(--line); padding-top: 8px; }
.rows .total dt, .rows .total dd { color: var(--fg); font-weight: 600; }
.rows .dp dt, .rows .dp dd { color: var(--accent); font-weight: 600; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input { font-size: 15px; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--screen); color: var(--fg); width: 100%; }
.field input[aria-invalid="true"] { border-color: var(--danger); }
.err { color: var(--danger); font-size: 13px; margin: 0; }

/* Metode & bayar */
.lockbar { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--accent-soft); padding: 10px 16px; font-size: 13px; }
.lockbar b { font: 600 14px var(--f-mono); font-variant-numeric: tabular-nums; }
.lockbar.late { background: var(--warn-soft); }
.lockbar.late b { color: var(--warn); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--screen); color: var(--fg); cursor: pointer; width: 100%; }
.opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); margin-top: 2px; background: var(--screen); }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-checked="true"] .dot { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--screen); }
.opt b { display: block; font-weight: 600; }
.opt span { font-size: 13px; color: var(--muted); }
.cd-big { font: 600 40px/1.1 var(--f-mono); margin: 0; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.cd-big.late { color: var(--warn); }
.amount { font: 600 24px var(--f-display); margin: 0; font-variant-numeric: tabular-nums; }
.qr { width: 180px; aspect-ratio: 1; }
.va { display: flex; gap: 8px; align-items: center; justify-content: space-between; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; text-align: left; }
.va code { font: 600 17px var(--f-mono); letter-spacing: .02em; user-select: all; }
.small-btn { border: 1.5px solid var(--line); background: var(--screen); color: var(--fg); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 13px; cursor: pointer; flex: none; }
.steps { text-align: left; margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; width: 100%; }
.divider { height: 1px; background: var(--line); width: 100%; }

/* Hasil */
.res-icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-top: 12px; }
.res-icon.bad { background: var(--danger-soft); color: var(--danger); }
.res-icon.warn { background: var(--warn-soft); color: var(--warn); }
.res { font: 600 22px/1.25 var(--f-display); margin: 0; }
.lead { margin: 0; color: var(--muted); max-width: 32ch; }
.ticket { width: 100%; border: 1.5px dashed var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; text-align: left; }
.ticket .label { text-align: center; }
.kode { font: 600 30px var(--f-mono); letter-spacing: .06em; margin: -4px 0 0; text-align: center; }

/* Lapisan dalam layar */
.toast { position: absolute; left: 12px; right: 12px; bottom: 100px; background: var(--fg); color: var(--screen); padding: 10px 14px; border-radius: 10px; font-size: 14px; z-index: 5; }
.overlay { position: absolute; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; z-index: 6; }
.sheet { background: var(--screen); width: 100%; padding: 20px 16px 18px; border-radius: 20px 20px 0 0; display: grid; gap: 10px; }
.sheet h3 { font: 600 18px var(--f-display); margin: 0; }
.sheet p { margin: 0 0 4px; color: var(--muted); font-size: 14px; }

/* Catatan desain */
.notes { background: var(--screen); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; min-width: 0; max-width: 400px; width: 100%; margin-inline: auto; }
@media (min-width: 820px) { .notes { max-width: none; } }
.notes h2 { font: 600 18px var(--f-display); margin: 0; }
#notes-title { font: 500 12px/1.4 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin: 0; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
#sims { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.sim { border: 1.5px dashed var(--warn); color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-weight: 600; font-size: 13px; text-align: left; cursor: pointer; }
.foot-note { font-size: 12px; color: var(--muted); margin: 0; border-top: 1px solid var(--line); padding-top: 10px; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">Wireframe · Desain Interaktif dan Usability</p>
    <h1>Booking Lapangan Futsal</h1>
    <p class="meta">Proses pemesanan jadwal dan pembayaran uang muka (DP) · Ahmad Yusuf (25010110186)</p>
  </header>

  <div class="layout">
    <div class="stage">
      <nav class="stepnav" aria-label="Navigasi layar">
        <button class="nav-btn" id="prev" data-act="step:-1" aria-label="Layar sebelumnya">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <label for="pick" class="sr-only">Pilih layar</label>
        <select id="pick">
          <optgroup label="Alur utama">
            <option value="beranda">1. Beranda</option>
            <option value="lapangan">2. Pilih Lapangan</option>
            <option value="jadwal">3. Pilih Jadwal</option>
            <option value="ringkasan">4. Ringkasan Pesanan</option>
            <option value="metode">5. Pilih Metode Bayar</option>
            <option value="bayar">6. Instruksi Pembayaran</option>
            <option value="berhasil">7. Booking Berhasil</option>
          </optgroup>
          <optgroup label="Kondisi khusus">
            <option value="gagal">Pembayaran Gagal</option>
            <option value="kedaluwarsa">Waktu Bayar Habis</option>
          </optgroup>
        </select>
        <button class="nav-btn" id="next" data-act="step:1" aria-label="Layar berikutnya">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </nav>
      <div class="device" id="device" aria-live="polite"></div>
    </div>

    <aside class="notes" aria-labelledby="notes-h">
      <h2 id="notes-h">Catatan desain</h2>
      <p id="notes-title"></p>
      <ul id="notes-list"></ul>
      <div id="sims" hidden></div>
      <p class="foot-note">Semua tombol di dalam layar bisa diketuk. Nama, harga, dan jadwal terisi hanya contoh.</p>
    </aside>
  </div>
</div>

<script>
(function () {
  var ORDER = ['beranda', 'lapangan', 'jadwal', 'ringkasan', 'metode', 'bayar', 'berhasil'];
  var ALT = ['gagal', 'kedaluwarsa'];
  var ALL = ORDER.concat(ALT);
  var NAMES = {
    beranda: 'Beranda', lapangan: 'Pilih Lapangan', jadwal: 'Pilih Jadwal', ringkasan: 'Ringkasan Pesanan',
    metode: 'Pilih Metode Bayar', bayar: 'Instruksi Pembayaran', berhasil: 'Booking Berhasil',
    gagal: 'Pembayaran Gagal', kedaluwarsa: 'Waktu Bayar Habis'
  };
  var BACK = { lapangan: 'beranda', jadwal: 'lapangan', ringkasan: 'jadwal', metode: 'ringkasan', berhasil: 'beranda', gagal: 'metode', kedaluwarsa: 'jadwal' };
  var LAPANGAN = [
    { nama: 'Lapangan A', jenis: 'Rumput sintetis · Indoor' },
    { nama: 'Lapangan B', jenis: 'Rumput sintetis · Outdoor' },
    { nama: 'Lapangan C', jenis: 'Vinyl · Indoor' }
  ];
  var METODE = [
    { id: 'qris', nama: 'QRIS', ket: 'Scan dari aplikasi bank atau e-wallet apa pun' },
    { id: 'va', nama: 'Transfer Bank (Virtual Account)', ket: 'BCA, BNI, BRI, Mandiri' },
    { id: 'ewallet', nama: 'E-wallet', ket: 'Bayar langsung dari aplikasi e-wallet' }
  ];
  var HOURS = []; for (var h0 = 8; h0 <= 22; h0++) HOURS.push(h0);
  var DP_RATE = 0.5, LOCK_MIN = 15;

  var NOTES = {
    beranda: ['Tombol "Booking Lapangan" dibuat paling besar karena itu tugas utama pengguna.', 'Bagian "Booking aktif" yang kosong diberi pesan, bukan dibiarkan kosong, supaya pengguna tahu belum ada pesanan.'],
    lapangan: ['Setiap kartu menampilkan jenis lantai dan harga mulai, informasi yang paling dicari sebelum memilih.', 'Seluruh kartu bisa diketuk, bukan hanya teksnya, sehingga target sentuh besar.'],
    jadwal: ['Ketersediaan ditampilkan sebagai grid jam, jadi slot kosong terlihat sekilas tanpa perlu mencoba satu per satu.', 'Slot terisi diberi arsir, coretan, dan label "Terisi", tidak hanya warna, agar tetap terbaca oleh pengguna buta warna.', 'Total harga diperbarui langsung setiap kali slot dipilih.'],

        st.sel.forEach(function (h) { st.taken[key(h)] = true; });
        st.kode = newKode();
        st.booking = { lap: st.lap, date: st.date, sel: st.sel.slice(), kode: st.kode };
        st.lockUntil = 0; go('berhasil'); break;
      case 'stay': st.confirm = false; render(); break;
      case 'cancelPay': st.confirm = false; st.lockUntil = 0; st.sel = []; toast('Pembayaran dibatalkan. Jadwal sudah dilepas.'); go('jadwal'); break;
      case 'copy': copyVA(); break;
      case 'openEwallet': toast('Di aplikasi asli, tombol ini membuka aplikasi e-wallet.'); render(); break;
      case 'save': toast('Bukti booking disimpan ke galeri (simulasi).'); render(); break;
      case 'home': st.sel = []; st.kode = ''; go('beranda'); break;
      case 'retry': st.sel = []; go('jadwal'); break;
      case 'simDirebut':
        ensureSel();
        var last = st.sel[st.sel.length - 1];
        st.taken[key(last)] = true; st.sel = [];
        toast('Jam ' + hh(last) + ' baru saja dipesan orang lain. Pilih jam lain.');
        go('jadwal'); break;
      case 'simGagal': go('gagal'); break;
      case 'simHabis': expire(); break;
    }
  }

  function tick() {
    var l = left();
    var els = dev.querySelectorAll('[data-cd]');
    for (var i = 0; i < els.length; i++) {
      els[i].textContent = fmtCd(l);
      var late = l < 180000;
      if (els[i].classList.contains('cd-big')) els[i].classList.toggle('late', late);
      var bar = els[i].closest('.lockbar'); if (bar) bar.classList.toggle('late', late);
    }
  }
  setInterval(function () {
    tick();
    if (st.lockUntil && left() <= 0 && ['metode', 'bayar', 'gagal'].indexOf(cur) >= 0) expire();
  }, 1000);

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var parts = b.getAttribute('data-act').split(':');
    act(parts[0], parts[1]);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'nama') { st.nama = e.target.value; validate(); }
    if (e.target.id === 'hp') { st.hp = e.target.value; validate(); }
  });
  pick.addEventListener('change', function () { go(pick.value); });
  window.addEventListener('hashchange', render);
  render();
})();
</script>

</body>
</html>
